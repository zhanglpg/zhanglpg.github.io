<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>HotCRP Paper Tracker</title>
<style>
  :root {
    --bg: #0b1120;
    --surface: #131b2e;
    --surface-2: #1c2640;
    --border: #2a3656;
    --text: #e6ecff;
    --muted: #94a3b8;
    --dim: #64748b;
    --accent: #818cf8;
    --good: #10b981;
    --ok: #fbbf24;
    --bad: #ef4444;
    --reviews: #38bdf8;
    --award: #fbbf24;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", Inter, Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  .page-header {
    background: linear-gradient(135deg, #1e293b 0%, #0b1120 100%);
    padding: 22px 28px 26px;
    border-bottom: 1px solid var(--border);
  }
  .page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .page-header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .page-header .meta { color: var(--dim); font-size: 12px; margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  .page-header .meta b { color: var(--text); font-weight: 600; }

  .container { max-width: 1320px; margin: 0 auto; padding: 22px; }
  @media (max-width: 720px) {
    .container { padding: 16px; }
    .page-header { padding: 18px 18px 20px; }
  }

  .status-strip {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 980px) {
    .status-strip { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 540px) {
    .status-strip { grid-template-columns: repeat(2, 1fr); }
  }
  .status-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .status-tile:hover { border-color: #3b4a72; }
  .status-tile.active { background: var(--surface-2); border-color: var(--accent); }
  .status-tile .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .status-tile .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }
  .status-tile.award .n { color: var(--award); }
  .status-tile.accepted .n, .status-tile.camera_ready .n { color: var(--good); }
  .status-tile.reviews_received .n { color: var(--reviews); }
  .status-tile.submitted .n { color: var(--text); }
  .status-tile.likely_rejected .n { color: var(--bad); }
  .status-tile.all .n { color: var(--accent); }
  .status-tile .sub-count {
    font-size: 9px; color: var(--dim); font-style: italic;
    text-transform: none; letter-spacing: 0;
    margin-top: 1px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search {
    flex: 1; min-width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
  }
  .search::placeholder { color: var(--dim); }
  .pill-group { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 1px; }
  .pill {
    padding: 6px 12px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .pill:hover { color: var(--text); }
  .pill.active { background: var(--surface-2); color: var(--text); }

  .conference-group { margin-bottom: 22px; }
  .conf-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }
  .conf-header .name { font-size: 16px; font-weight: 700; color: var(--text); }
  .conf-header .count { font-size: 12px; color: var(--dim); }
  .conf-header .chev { color: var(--dim); margin-left: auto; transition: transform 0.15s; }
  .conf-group.collapsed .conf-header .chev { transform: rotate(-90deg); }
  .conf-group.collapsed .papers { display: none; }

  .papers { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }

  .paper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    transition: border-color 0.15s, transform 0.15s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .paper:hover { border-color: #3b4a72; }
  .paper::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--dim);
  }
  .paper.s-submitted::before { background: #818cf8; }
  .paper.s-updated::before { background: #818cf8; }
  .paper.s-reviews_received::before { background: var(--reviews); }
  .paper.s-borderline::before { background: var(--ok); }
  .paper.s-accepted::before, .paper.s-camera_ready::before, .paper.s-likely_accepted::before { background: var(--good); }
  .paper.s-likely_rejected::before { background: var(--bad); }
  .paper.s-award::before { background: var(--award); }

  .paper .top { display: flex; gap: 10px; align-items: flex-start; }
  .paper .id { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 1px; flex-shrink: 0; }
  .paper .title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.35; }
  .paper .status-badge {
    font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 999px;
    white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em;
    flex-shrink: 0;
  }
  .b-submitted, .b-updated { background: rgba(129,140,248,0.15); color: #a5b4fc; }
  .b-reviews_received { background: rgba(56,189,248,0.15); color: var(--reviews); }
  .b-accepted, .b-camera_ready, .b-likely_accepted { background: rgba(16,185,129,0.15); color: var(--good); }
  .b-award { background: rgba(251,191,36,0.18); color: var(--award); }
  .b-borderline { background: rgba(251,191,36,0.15); color: var(--ok); }
  .b-likely_rejected { background: rgba(239,68,68,0.15); color: var(--bad); }

  .inferred-tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-style: italic;
    font-weight: 500;
    letter-spacing: 0.03em;
    background: rgba(100,116,139,0.18);
    color: var(--muted);
    text-transform: none;
    vertical-align: middle;
  }

  .review-mean {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 8px;
    padding: 3px 9px;
    border-radius: 6px;
    background: var(--surface-2);
    font-size: 11px;
    color: var(--muted);
  }
  .review-mean .v { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .review-mean .scale { color: var(--dim); font-size: 10px; }
  .review-mean.high .v { color: var(--good); }
  .review-mean.mid .v { color: var(--ok); }
  .review-mean.low .v { color: var(--bad); }

  .paper .authors {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.4;
  }

  .paper .footer-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
    font-size: 11px;
    color: var(--dim);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px;
    background: var(--surface-2);
    border-radius: 999px;
    color: var(--muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .chip.has { color: var(--text); }
  .chip.has.reviews { color: var(--reviews); }
  .chip.has.comments { color: #c084fc; }
  .chip .num { font-weight: 600; }

  .paper .when { margin-left: auto; font-variant-numeric: tabular-nums; }

  .paper .events {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .paper.open .events { display: block; }
  .event {
    display: grid;
    grid-template-columns: 10px 1fr auto;
    gap: 10px;
    align-items: baseline;
    padding: 4px 0;
    font-size: 12px;
  }
  .event .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  .event.t-submitted .dot { background: #818cf8; }
  .event.t-updated .dot { background: #4c5e8e; }
  .event.t-comment .dot { background: #c084fc; }
  .event.t-reviews_received .dot { background: var(--reviews); }
  .event.t-accepted .dot, .event.t-camera_ready .dot { background: var(--good); }
  .event.t-award .dot { background: var(--award); }
  .event .what { color: var(--muted); }
  .event .what .type { color: var(--text); text-transform: capitalize; }
  .event .at { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; }

  .paper .site-link {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--accent);
  }
  .paper.open .site-link { display: inline-block; }

  .announcements {
    margin-top: 26px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .announcements h3 {
    padding: 12px 18px;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
  }
  .announcements.collapsed .list { display: none; }
  .announcements .chev { color: var(--dim); }
  .announcements.collapsed .chev { transform: rotate(-90deg); }
  .announcement {
    padding: 8px 18px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid rgba(42,54,86,0.5);
    display: flex;
    gap: 10px;
  }
  .announcement:last-child { border: none; }
  .announcement .conf { color: var(--text); font-weight: 500; min-width: 130px; }
  .announcement .when { color: var(--dim); margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }

  .empty { text-align: center; padding: 50px 20px; color: var(--dim); }
  .loading, .error { text-align: center; padding: 60px 22px; color: var(--dim); }
  .error { color: var(--bad); }

  .footer { text-align: center; padding: 22px; color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<div id="app" class="loading">Loading HotCRP data…</div>

<script>
"use strict";

const STATUS_ORDER = ["award", "camera_ready", "accepted", "likely_accepted", "reviews_received", "borderline", "submitted", "updated", "likely_rejected"];
const STATUS_LABEL = {
  award: "Award", camera_ready: "Camera-Ready", accepted: "Accepted",
  likely_accepted: "Likely Accept", borderline: "Borderline",
  reviews_received: "Reviews", submitted: "Submitted", updated: "Updated",
  likely_rejected: "Likely Reject",
  comment: "Comment", other: "Other", announcement: "Announcement",
};
const PREFS_KEY = "hotcrp-prefs-v1";

const prefs = (() => {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; }
})();
function savePref(k, v) { prefs[k] = v; localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "2-digit" });
}
function fmtDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function daysAgo(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const ms = Date.now() - d.getTime();
  const days = Math.floor(ms / 86400000);
  if (days < 0) return null;
  if (days === 0) return "today";
  if (days === 1) return "1d ago";
  if (days < 60) return `${days}d ago`;
  const months = Math.floor(days / 30);
  return `${months}mo ago`;
}

function statusBadge(status, source) {
  const badge = el("span", { class: "status-badge b-" + status }, STATUS_LABEL[status] || status);
  if (source === "inferred") {
    return el("span", { style: "display:inline-flex; align-items:center; flex-wrap:wrap; gap:4px;" },
      badge,
      el("span", { class: "inferred-tag", title: "Inferred from reviewer scores — no explicit notification received" }, "inferred"),
    );
  }
  return badge;
}

function reviewMeanChip(mean, scoreCount) {
  if (mean == null) return null;
  const band = mean >= 3.5 ? "high" : (mean <= 2.5 ? "low" : "mid");
  return el("div", { class: "review-mean " + band, title: "Mean overall-merit score on 1-5 scale (5=Strong accept)" },
    "Avg score:",
    el("span", { class: "v" }, mean.toFixed(2)),
    el("span", { class: "scale" }, `/ 5  (${scoreCount} review${scoreCount === 1 ? "" : "s"})`),
  );
}

function authorsLine(authors) {
  if (!authors || authors.length === 0) return null;
  const shown = authors.slice(0, 4).join(", ");
  if (authors.length <= 4) return shown;
  return `${shown}, +${authors.length - 4} more`;
}

function paperCard(p) {
  const card = el("div", { class: "paper s-" + p.status });
  const top = el("div", { class: "top" },
    el("span", { class: "id" }, "#" + p.paper_id),
    el("div", { class: "title" }, p.title || "(no title yet)"),
    statusBadge(p.status, p.status_source),
  );
  card.appendChild(top);

  const auths = authorsLine(p.authors);
  if (auths) card.appendChild(el("div", { class: "authors" }, auths));

  const meanChip = reviewMeanChip(p.review_mean, (p.review_scores || []).length);
  if (meanChip) card.appendChild(meanChip);

  const cnt = p.counts || {};
  const footer = el("div", { class: "footer-row" },
    el("span", { class: "chip" + (cnt.updates > 0 ? " has" : "") }, el("span", { class: "num" }, String(cnt.updates || 0)), " updates"),
    el("span", { class: "chip comments" + (cnt.comments > 0 ? " has" : "") }, el("span", { class: "num" }, String(cnt.comments || 0)), " comments"),
    el("span", { class: "chip reviews" + (cnt.reviews > 0 ? " has" : "") }, el("span", { class: "num" }, String(cnt.reviews || 0)), " reviews"),
    el("span", { class: "when" }, daysAgo(p.last_event) || ""),
  );
  card.appendChild(footer);

  // Expanded detail
  const events = (p.events || []).slice().reverse();
  const eventsDiv = el("div", { class: "events" },
    events.map(ev => el("div", { class: "event t-" + ev.type },
      el("span", { class: "dot" }),
      el("span", { class: "what" }, el("span", { class: "type" }, STATUS_LABEL[ev.type] || ev.type)),
      el("span", { class: "at" }, fmtDateTime(ev.date)),
    )),
  );
  card.appendChild(eventsDiv);
  if (p.site) {
    card.appendChild(el("a", { class: "site-link", href: p.site, target: "_blank", rel: "noopener" },
      "→ Open on HotCRP"));
  }

  card.addEventListener("click", (e) => {
    if (e.target.tagName === "A") return;
    card.classList.toggle("open");
  });
  return card;
}

function statusStrip(papers, currentFilter) {
  const counts = { all: papers.length };
  for (const s of STATUS_ORDER) counts[s] = 0;
  let acceptedInferred = 0, acceptedCanonical = 0;
  for (const p of papers) {
    counts[p.status] = (counts[p.status] || 0) + 1;
    if (p.status === "accepted" || p.status === "camera_ready") acceptedCanonical++;
    if (p.status === "likely_accepted") acceptedInferred++;
  }
  const acceptedTotal = acceptedCanonical + acceptedInferred + counts.award;
  const tile = (key, label, n, subText) => el("div", {
    class: "status-tile " + key + (currentFilter === key ? " active" : ""),
    onclick: () => { savePref("filter", key); rerender(); },
  },
    el("div", { class: "n" }, String(n)),
    el("div", { class: "l" }, label),
    subText ? el("div", { class: "sub-count" }, subText) : null,
  );

  return el("div", { class: "status-strip" },
    tile("all", "All Papers", papers.length, null),
    tile("award", "Award", counts.award || 0, null),
    tile("accepted", "Accepted",
      acceptedTotal,
      acceptedInferred > 0 ? `${acceptedCanonical + counts.award} confirmed · ${acceptedInferred} inferred` : null),
    tile("reviews_received", "Reviews In",
      (counts.reviews_received || 0) + (counts.borderline || 0),
      counts.borderline ? `${counts.borderline} borderline` : null),
    tile("submitted", "Under Review", (counts.submitted || 0) + (counts.updated || 0), null),
    tile("likely_rejected", "Likely Reject", counts.likely_rejected || 0, counts.likely_rejected ? "inferred" : null),
  );
}

function conferenceGroup(conf, papers, lastEvent) {
  const wrap = el("div", { class: "conf-group conference-group" + (prefs[`closed:${conf}`] ? " collapsed" : "") });
  const header = el("div", { class: "conf-header", onclick: () => {
    savePref(`closed:${conf}`, !prefs[`closed:${conf}`]);
    wrap.classList.toggle("collapsed");
  } },
    el("span", { class: "name" }, conf),
    el("span", { class: "count" }, `${papers.length} paper${papers.length === 1 ? "" : "s"} · updated ${daysAgo(lastEvent) || "—"}`),
    el("span", { class: "chev" }, "▾"),
  );
  wrap.appendChild(header);
  wrap.appendChild(el("div", { class: "papers" }, papers.map(paperCard)));
  return wrap;
}

let _data = null;
function rerender() { renderRoot(_data); }

function statusForFilter(p, f) {
  if (f === "all" || !f) return true;
  if (f === "submitted") return p.status === "submitted" || p.status === "updated";
  if (f === "accepted") return p.status === "accepted" || p.status === "camera_ready" || p.status === "award" || p.status === "likely_accepted";
  if (f === "reviews_received") return p.status === "reviews_received" || p.status === "borderline";
  return p.status === f;
}

function renderRoot(data) {
  _data = data;
  document.querySelectorAll("body > .page-header, body > .footer").forEach(n => n.remove());
  const root = document.getElementById("app");
  root.className = "";
  root.replaceChildren();

  const filter = prefs.filter || "all";
  const search = (prefs.search || "").trim().toLowerCase();

  const papers = Object.values(data.papers || {});
  const filtered = papers.filter(p => statusForFilter(p, filter)).filter(p => {
    if (!search) return true;
    const hay = [
      p.title || "",
      p.conference || "",
      (p.authors || []).join(" "),
      p.paper_id,
    ].join(" ").toLowerCase();
    return hay.includes(search);
  });

  // Group by conference, sort by recent activity
  const byConf = new Map();
  for (const p of filtered) {
    if (!byConf.has(p.conference)) byConf.set(p.conference, []);
    byConf.get(p.conference).push(p);
  }
  const confEntries = [...byConf.entries()].map(([c, ps]) => {
    ps.sort((a, b) => (b.last_event || "").localeCompare(a.last_event || ""));
    const lastEvent = ps[0]?.last_event;
    return { conf: c, papers: ps, lastEvent };
  });
  confEntries.sort((a, b) => (b.lastEvent || "").localeCompare(a.lastEvent || ""));

  const updatedRaw = data.last_updated ? new Date(data.last_updated) : null;
  const updatedStr = updatedRaw && !isNaN(updatedRaw)
    ? updatedRaw.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })
    : "—";

  const header = el("div", { class: "page-header" },
    el("h1", null, "📝 HotCRP Paper Tracker"),
    el("div", { class: "sub" }, "Submission, review, and decision status for papers across program committees"),
    el("div", { class: "meta" },
      el("span", null, "Updated ", el("b", null, updatedStr)),
      el("span", null, el("b", null, String(data.email_count || 0)), " emails processed"),
      el("span", null, el("b", null, String(papers.length)), " papers"),
      el("span", null, el("b", null, String(Object.keys(data.conferences || {}).length)), " venues"),
    ),
  );
  document.body.insertBefore(header, root);

  const searchInput = el("input", {
    class: "search",
    type: "search",
    placeholder: "Search title, author, conference, or paper #",
    value: prefs.search || "",
  });
  searchInput.addEventListener("input", (e) => {
    const cursor = e.target.selectionStart;
    savePref("search", e.target.value);
    rerender();
    const next = document.querySelector(".search");
    if (next) { next.focus(); next.setSelectionRange(cursor, cursor); }
  });

  const container = el("div", { class: "container" },
    statusStrip(papers, filter),
    el("div", { class: "toolbar" }, searchInput),
    confEntries.length === 0
      ? el("div", { class: "empty" }, "No papers match your filters.")
      : confEntries.map(({ conf, papers, lastEvent }) => conferenceGroup(conf, papers, lastEvent)),
    announcementsSection(data.announcements || [], { search }),
  );
  root.appendChild(container);
  document.body.appendChild(el("div", { class: "footer" },
    "Auto-updated from HotCRP email notifications · Powered by Hermes Agent",
  ));
}

function announcementsSection(items, { search }) {
  if (!items.length) return null;
  // Announcements are venue-level (no paper status), so the status tiles
  // don't apply. They track the search box only (conference / subject).
  const matches = items.filter(a => {
    if (!search) return true;
    const conf = (a.conference || "").toLowerCase();
    const subj = (a.subject || "").toLowerCase();
    return conf.includes(search) || subj.includes(search);
  });
  if (!matches.length) return null;
  const sorted = matches.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).slice(0, 30);
  const closed = !!prefs["closed:announcements"];
  const wrap = el("div", { class: "announcements" + (closed ? " collapsed" : "") });
  const head = el("h3", { onclick: () => {
    savePref("closed:announcements", !prefs["closed:announcements"]);
    wrap.classList.toggle("collapsed");
  } },
    el("span", null, `📢 Announcements & reminders (${matches.length}${matches.length < items.length ? " of " + items.length : ""})`),
    el("span", { class: "chev" }, "▾"),
  );
  wrap.appendChild(head);
  wrap.appendChild(el("div", { class: "list" },
    sorted.map(a => el("div", { class: "announcement" },
      el("span", { class: "conf" }, a.conference || ""),
      el("span", { style: "flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" }, a.subject || ""),
      el("span", { class: "when" }, fmtDate(a.date)),
    )),
  ));
  return wrap;
}

function bust(u) { return u + "?t=" + Date.now(); }

// Clear any previous page-header that we attached above the app
function prepareDom() {
  document.querySelectorAll("body > .page-header").forEach(n => n.remove());
}

(function load() {
  fetch(bust("data.json"))
    .then(r => r.ok ? r.json() : Promise.reject(new Error("data.json not found")))
    .then(data => { prepareDom(); renderRoot(data); })
    .catch(err => {
      document.getElementById("app").outerHTML =
        `<div id="app" class="error">⚠️ ${String(err.message || err)}<br><small>The pipeline will create data.json on next run.</small></div>`;
    });
})();
</script>
</body>
</html>
