<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liping Zhang · Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="data.js"></script>
<style>
  :root{
    --bg:#0e1014;
    --bg-2:#12151c;
    --card:#161a22;
    --card-2:#1b202b;
    --line:#242b38;
    --line-2:#2e3748;
    --txt:#e9edf4;
    --txt-2:#a7b0c0;
    --txt-3:#6f7a8d;
    --run:#ff6b35;
    --run-soft:rgba(255,107,53,.14);
    --strength:#3ddc84;
    --strength-soft:rgba(61,220,132,.13);
    --seg:#4cc9f0;
    --seg-soft:rgba(76,201,240,.13);
    --hike:#ffc857;
    --hike-soft:rgba(255,200,87,.13);
    --row:#b388ff;
    --good:#3ddc84;
    --bad:#ff5d5d;
    --disp:'Bebas Neue',sans-serif;
    --body:'Space Grotesk',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);
    background:var(--bg);
    color:var(--txt);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  /* layered ambient background */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(900px 500px at 8% -6%, rgba(255,107,53,.09), transparent 60%),
      radial-gradient(800px 520px at 100% 0%, rgba(76,201,240,.07), transparent 55%),
      radial-gradient(700px 600px at 50% 110%, rgba(61,220,132,.06), transparent 60%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:linear-gradient(180deg,#000 0%,transparent 70%);
  }
  #root{position:relative;z-index:1}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* ---------- header ---------- */
  header{
    padding:44px 0 26px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  }
  .id-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .who .eyebrow{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--run);
    font-weight:600;display:flex;align-items:center;gap:8px;
  }
  .who .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--run);
    box-shadow:0 0 0 0 rgba(255,107,53,.5);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,107,53,.45)}70%{box-shadow:0 0 0 9px rgba(255,107,53,0)}100%{box-shadow:0 0 0 0 rgba(255,107,53,0)}}
  .who h1{
    font-family:var(--disp);font-weight:400;
    font-size:clamp(46px,7vw,76px);line-height:.95;letter-spacing:.01em;margin-top:8px;
  }
  .who h1 .accent{color:var(--run)}
  .who .meta{color:var(--txt-2);font-size:14px;margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
  .who .meta b{color:var(--txt);font-weight:600}

  .assess{
    display:flex;gap:0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;min-width:320px;
  }
  .assess .cell{padding:16px 20px;text-align:center;position:relative}
  .assess .cell + .cell{border-left:1px solid var(--line)}
  .assess .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);font-weight:600}
  .assess .v{font-family:var(--disp);font-size:34px;line-height:1.05;margin-top:4px}
  .assess .v small{font-size:15px;color:var(--txt-3);letter-spacing:.06em}
  .assess .v.o{color:var(--run)} .assess .v.g{color:var(--strength)} .assess .v.b{color:var(--seg)}

  /* ---------- tabs ---------- */
  nav.tabs{
    position:sticky;top:0;z-index:20;background:rgba(14,16,20,.86);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  }
  .tabs .inner{display:flex;gap:4px;overflow-x:auto}
  .tab{
    appearance:none;background:none;border:none;cursor:pointer;color:var(--txt-2);
    font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.02em;
    padding:16px 18px;position:relative;white-space:nowrap;transition:color .2s;
  }
  .tab:hover{color:var(--txt)}
  .tab.active{color:var(--txt)}
  .tab.active::after{
    content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;
    background:var(--run);border-radius:3px 3px 0 0;
  }
  .tab .n{font-size:11px;color:var(--txt-3);margin-left:6px;font-weight:500}

  /* ---------- sections ---------- */
  main{padding:34px 0 80px}
  .panel{display:none}
  .panel.active{display:block;animation:fadeUp .45s cubic-bezier(.22,.8,.3,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:6px 0 20px;flex-wrap:wrap}
  .sec-head h2{font-family:var(--disp);font-weight:400;font-size:34px;letter-spacing:.02em}
  .sec-head .sub{color:var(--txt-3);font-size:13px}

  .grid{display:grid;gap:18px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
  @media(max-width:560px){.g4{grid-template-columns:1fr}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px;transition:transform .25s cubic-bezier(.22,.8,.3,1),border-color .25s,box-shadow .25s;
  }
  .card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:0 12px 32px rgba(0,0,0,.35)}
  .card .label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3);font-weight:600}
  .card .big{font-family:var(--disp);font-size:44px;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
  .card .sub{color:var(--txt-2);font-size:13px;margin-top:6px}

  /* reveal on scroll */
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,.8,.3,1)}
  .reveal.in{opacity:1;transform:none}

  /* ---------- PB cards ---------- */
  .pb{position:relative;overflow:hidden}
  .pb .dist{font-family:var(--disp);font-size:64px;line-height:1;color:var(--run)}
  .pb .pace{font-family:var(--disp);font-size:40px;margin-top:6px;font-variant-numeric:tabular-nums}
  .pb .pace small{font-size:16px;color:var(--txt-3)}
  .pb .when{color:var(--txt-2);font-size:13px;margin-top:10px}
  .pb .trophy{position:absolute;top:14px;right:16px;font-size:20px;opacity:.9}
  .pb::after{content:"";position:absolute;inset:auto -30px -30px auto;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle,var(--run-soft),transparent 70%)}
  .pb .ribbon{
    position:absolute;top:16px;left:-34px;transform:rotate(-45deg);
    background:var(--run);color:#fff;font-size:10px;font-weight:700;letter-spacing:.12em;
    padding:4px 40px;text-transform:uppercase;
  }

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{
    text-align:left;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--txt-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);
  }
  td{padding:12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{transition:background .18s}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .rank{font-family:var(--disp);font-size:20px;color:var(--txt-3);width:34px}
  .rank.r1{color:var(--run)} .rank.r2{color:var(--seg)} .rank.r3{color:var(--hike)}
  .mono{font-variant-numeric:tabular-nums;font-weight:600}
  .chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.04em}
  .chip.run{background:var(--run-soft);color:var(--run)}
  .chip.trail{background:var(--hike-soft);color:var(--hike)}
  .chip.strength{background:var(--strength-soft);color:var(--strength)}
  .chip.hike{background:var(--hike-soft);color:var(--hike)}
  .chip.row{background:rgba(179,136,255,.14);color:var(--row)}
  .chip.cardio{background:var(--seg-soft);color:var(--seg)}

  /* ---------- strength ---------- */
  .routine{padding:0;overflow:hidden}
  .routine .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 20px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(61,220,132,.05),transparent);
  }
  .routine .top h3{font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.02em}
  .routine .top .cnt{color:var(--txt-3);font-size:12px}
  .routine .body{display:grid;grid-template-columns:1fr 1fr 1fr 1.4fr;gap:0}
  @media(max-width:820px){.routine .body{grid-template-columns:1fr 1fr}}
  .metric{padding:16px 20px;border-right:1px solid var(--line)}
  .metric:last-child{border-right:none}
  @media(max-width:820px){.metric{border-bottom:1px solid var(--line)}}
  .metric .mk{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);font-weight:600}
  .metric .mv{font-family:var(--disp);font-size:30px;margin-top:6px;font-variant-numeric:tabular-nums}
  .metric .mv small{font-size:14px;color:var(--txt-3)}
  .delta{font-size:12px;font-weight:600;margin-left:8px}
  .delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--txt-3)}
  .spark{padding:16px 20px}

  /* ---------- feed ---------- */
  .feed-item{
    display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);
    transition:background .18s;cursor:default;
  }
  .feed-item:last-child{border-bottom:none}
  .feed-item:hover{background:rgba(255,255,255,.03)}
  .feed-item .icon{
    width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:19px;flex-shrink:0;
  }
  .feed-item .mid{flex:1;min-width:0}
  .feed-item .title{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feed-item .detail{color:var(--txt-3);font-size:12px;margin-top:3px}
  .feed-item .stats{display:flex;gap:20px;text-align:right;flex-shrink:0}
  .feed-item .stats .sv{font-family:var(--disp);font-size:22px;font-variant-numeric:tabular-nums}
  .feed-item .stats .sk{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}
  @media(max-width:640px){.feed-item .stats{gap:12px}.feed-item .stats .sv{font-size:18px}}

  .chart-card{padding:22px}
  .chart-card h3{font-family:var(--disp);font-weight:400;font-size:22px;margin-bottom:4px}
  .chart-card .csub{color:var(--txt-3);font-size:12px;margin-bottom:16px}
  svg text{font-family:var(--body)}
  .drawline{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.6s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .bar{transform-origin:bottom;animation:grow .8s cubic-bezier(.22,.8,.3,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
  .legend span{font-size:12px;color:var(--txt-2);display:flex;align-items:center;gap:7px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .empty{color:var(--txt-3);font-size:14px;padding:30px;text-align:center}
  footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--txt-3);font-size:12px}
  footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .countup{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-code">
const { useState, useEffect, useRef, useMemo } = React;

/* ------------------------------ utils ------------------------------ */
const D = (typeof DATA !== "undefined") ? DATA : null;

const SPORT_ICON = { run:"🏃", trail:"⛰️", strength:"🏋️", hike:"🥾", row:"🚣", cardio:"🫀" };
const SPORT_COLOR = { run:"var(--run)", trail:"var(--hike)", strength:"var(--strength)",
                      hike:"var(--hike)", row:"var(--row)", cardio:"var(--seg)" };
const SPORT_BG = { run:"var(--run-soft)", trail:"var(--hike-soft)", strength:"var(--strength-soft)",
                   hike:"var(--hike-soft)", row:"rgba(179,136,255,.14)", cardio:"var(--seg-soft)" };

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function shortDate(iso){
  if(!iso) return "";
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}

/* animated counter */
function useCountUp(target, dur=900){
  const [v,setV]=useState(0);
  useEffect(()=>{
    if(target==null) return;
    let raf, start=null;
    const step=(t)=>{ if(start==null) start=t;
      const p=Math.min((t-start)/dur,1);
      const e=1-Math.pow(1-p,3);
      setV(target*e);
      if(p<1) raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[target]);
  return v;
}

/* scroll reveal */
function useReveal(){
  useEffect(()=>{
    const els=document.querySelectorAll(".reveal:not(.in)");
    const io=new IntersectionObserver((es)=>{
      es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} });
    },{threshold:.12});
    els.forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  });
}

/* ------------------------------ charts ------------------------------ */
function PaceTrend({points}){
  const W=760,H=240,P={l:46,r:14,t:14,b:28};
  const pts=points.filter(p=>p.paceSec);
  if(pts.length<2) return <div className="empty">Not enough runs yet.</div>;
  const paces=pts.map(p=>p.paceSec);
  let min=Math.min(...paces), max=Math.max(...paces);
  const pad=(max-min)*0.12||30; min-=pad; max+=pad;
  const x=i=>P.l+(W-P.l-P.r)*(i/(pts.length-1));
  const y=v=>P.t+(H-P.t-P.b)*((v-min)/(max-min)); // low pace = low on chart; we invert below
  const yInv=v=>P.t+(H-P.t-P.b)*(1-(v-min)/(max-min)); // faster (lower) = higher
  const path=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${yInv(p.paceSec).toFixed(1)}`).join(" ");
  const area=path+` L${x(pts.length-1).toFixed(1)},${H-P.b} L${x(0).toFixed(1)},${H-P.b} Z`;
  const ticks=[min+pad, (min+max)/2, max-pad].map(v=>Math.round(v));
  const fmt=v=>`${Math.floor(v/60)}:${String(Math.round(v%60)).padStart(2,"0")}`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--run)" stopOpacity=".28"/>
          <stop offset="100%" stopColor="var(--run)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {ticks.map((t,i)=>(
        <g key={i}>
          <line x1={P.l} x2={W-P.r} y1={yInv(t)} y2={yInv(t)} stroke="var(--line)" strokeDasharray="3 4"/>
          <text x={P.l-8} y={yInv(t)+4} textAnchor="end" fontSize="10" fill="var(--txt-3)">{fmt(t)}</text>
        </g>
      ))}
      <path d={area} fill="url(#pg)"/>
      <path d={path} fill="none" stroke="var(--run)" strokeWidth="2.4" strokeLinejoin="round" className="drawline"/>
      {pts.map((p,i)=>(
        <circle key={i} cx={x(i)} cy={yInv(p.paceSec)} r="3" fill="var(--bg)" stroke="var(--run)" strokeWidth="1.6">
          <title>{fmtDate(p.date)} · {fmt(p.paceSec)} /km · {p.distKm} km</title>
        </circle>
      ))}
      <text x={P.l} y={H-8} fontSize="10" fill="var(--txt-3)">{shortDate(pts[0].date)}</text>
      <text x={W-P.r} y={H-8} textAnchor="end" fontSize="10" fill="var(--txt-3)">{shortDate(pts[pts.length-1].date)}</text>
    </svg>
  );
}

function MonthlyBars({data}){
  const W=760,H=220,P={l:40,r:10,t:16,b:26};
  if(!data.length) return <div className="empty">No volume yet.</div>;
  const max=Math.max(...data.map(d=>d.km));
  const bw=(W-P.l-P.r)/data.length;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
      {data.map((d,i)=>{
        const h=(H-P.t-P.b)*(d.km/max);
        const isLast=i===data.length-1;
        return (
          <g key={d.month}>
            <rect className="bar" style={{animationDelay:`${i*40}ms`}}
              x={P.l+i*bw+bw*0.18} y={H-P.b-h} width={bw*0.64} height={h} rx="3"
              fill={isLast?"var(--run)":"var(--seg)"} opacity={isLast?1:0.55}>
              <title>{d.month} · {d.km} km · {d.runs} runs</title>
            </rect>
            {(i%2===0||isLast) && (
              <text x={P.l+i*bw+bw/2} y={H-8} textAnchor="middle" fontSize="9.5" fill="var(--txt-3)">
                {d.month.slice(5)}
              </text>
            )}
          </g>
        );
      })}
      <text x={P.l-6} y={P.t+4} textAnchor="end" fontSize="10" fill="var(--txt-3)">{Math.round(max)}km</text>
      <line x1={P.l} x2={W-P.r} y1={H-P.b} y2={H-P.b} stroke="var(--line)"/>
    </svg>
  );
}

function Sparkline({values,color="var(--strength)",height=44}){
  const W=160,H=height,P=4;
  if(!values||values.length<2) return null;
  const min=Math.min(...values),max=Math.max(...values);
  const rng=(max-min)||1;
  const x=i=>P+(W-2*P)*(i/(values.length-1));
  const y=v=>P+(H-2*P)*(1-(v-min)/rng);
  const path=values.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:180,height:"auto"}}>
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" className="drawline"/>
      <circle cx={x(values.length-1)} cy={y(values[values.length-1])} r="3" fill={color}/>
    </svg>
  );
}

/* ------------------------------ pieces ------------------------------ */
function StatCard({label,value,sub,color,delay=0}){
  const v=useCountUp(typeof value==="number"?value:0);
  const isNum=typeof value==="number";
  return (
    <div className="card reveal" style={{transitionDelay:`${delay}ms`}}>
      <div className="label">{label}</div>
      <div className="big countup" style={color?{color}:null}>
        {isNum? Math.round(v).toLocaleString() : value}
      </div>
      {sub && <div className="sub">{sub}</div>}
    </div>
  );
}

function Delta({now,prev,unit="",invert=false}){
  if(prev==null||now==null) return null;
  const d=now-prev;
  if(Math.abs(d)<1e-9) return <span className="delta flat">—</span>;
  const good = invert ? d<0 : d>0;
  const arrow = d>0?"▲":"▼";
  return <span className={`delta ${good?"up":"down"}`}>{arrow} {Math.abs(Math.round(d*10)/10)}{unit}</span>;
}

/* ------------------------------ sections ------------------------------ */
function Overview(){
  const t=D.totals;
  const recent=[
    ...D.runs.map(r=>({...r,_cat:r.category})),
    ...D.strength.map(s=>({...s,category:"strength",sportName:"Strength",location:s.routine,_cat:"strength"})),
    ...D.others.map(o=>({...o,_cat:o.category})),
  ].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,14);

  return (
    <div>
      <div className="sec-head">
        <h2>Overview</h2>
        <div className="sub">{t.activities} activities · {t.firstDate} → {t.latestDate}</div>
      </div>
      <div className="grid g4">
        <StatCard label="Total Runs" value={t.runs} sub={`${t.runKm.toLocaleString()} km covered`} color="var(--run)"/>
        <StatCard label="Strength Sessions" value={t.strength} sub="rehab → build phase" color="var(--strength)" delay={60}/>
        <StatCard label="Hikes" value={t.hikes} sub="weekend mountains" color="var(--hike)" delay={120}/>
        <StatCard label="Calories Burned" value={t.calories} sub="all disciplines" color="var(--seg)" delay={180}/>
      </div>

      <div className="grid g2" style={{marginTop:18}}>
        <div className="card chart-card reveal">
          <h3>Run Pace Trend</h3>
          <div className="csub">Average pace per run · higher line = faster</div>
          <PaceTrend points={D.runTrend}/>
          <div className="legend">
            <span><i style={{background:"var(--run)"}}></i>avg pace /km</span>
            <span style={{color:"var(--txt-3)"}}>flat runs · trail excluded</span>
          </div>
        </div>
        <div className="card chart-card reveal">
          <h3>Monthly Running Volume</h3>
          <div className="csub">Kilometres per calendar month</div>
          <MonthlyBars data={D.monthlyVolume}/>
        </div>
      </div>

      <div className="card reveal" style={{marginTop:18,padding:0,overflow:"hidden"}}>
        <div style={{padding:"18px 20px 10px"}}><h3 style={{fontFamily:"var(--disp)",fontWeight:400,fontSize:22}}>Recent Activities</h3></div>
        {recent.map((a,i)=>{
          const cat=a._cat||"run";
          const main = cat==="strength"
            ? <span className="sv">{a.sets}<span style={{fontSize:12,color:"var(--txt-3)"}}> sets</span></span>
            : (a.distKm? <span className="sv">{a.distKm}<span style={{fontSize:12,color:"var(--txt-3)"}}> km</span></span>
                       : <span className="sv">{a.duration}</span>);
          return (
            <div className="feed-item" key={a.labelId+i}>
              <div className="icon" style={{background:SPORT_BG[cat]}}>{SPORT_ICON[cat]}</div>
              <div className="mid">
                <div className="title">{a.sportName||a.routine||cat} <span className={`chip ${cat}`} style={{marginLeft:6}}>{cat}</span></div>
                <div className="detail">{fmtDate(a.date)} · {a.location||""}</div>
              </div>
              <div className="stats">
                <div>{main}<div className="sk">{cat==="strength"?"volume":"distance"}</div></div>
                {a.durationSec && cat!=="strength" && <div><span className="sv">{a.duration}</span><div className="sk">time</div></div>}
                {a.pace && <div><span className="sv">{a.pace}</span><div className="sk">/km</div></div>}
                {a.hr && <div><span className="sv">{a.hr}</span><div className="sk">bpm</div></div>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PBs(){
  return (
    <div>
      <div className="sec-head">
        <h2>Personal Bests</h2>
        <div className="sub">Fastest rolling splits from flat runs (road + track)</div>
      </div>
      <div className="grid g4">
        {D.pbs.map((pb,i)=>(
          <div className="card pb reveal" key={pb.dist} style={{transitionDelay:`${i*70}ms`}}>
            {i===0 && <div className="ribbon">Fastest</div>}
            <div className="trophy">{["🥇","🥈","🥉","🏅"][i]||"🏅"}</div>
            <div className="dist">{pb.dist}</div>
            <div className="pace">{pb.pace}<small> /km</small></div>
            <div className="when">{fmtDate(pb.date)} · {pb.runName}</div>
            <div className="when" style={{color:"var(--txt-3)",marginTop:2}}>
              {Math.floor(pb.seconds/60)}:{String(Math.round(pb.seconds%60)).padStart(2,"0")} total
            </div>
          </div>
        ))}
      </div>
      {D.pbs.length===0 && <div className="card empty">No lap data yet — PBs appear once runs sync.</div>}

      <div className="card reveal" style={{marginTop:22,padding:0,overflow:"hidden"}}>
        <div style={{padding:"18px 20px 6px"}}>
          <h3 style={{fontFamily:"var(--disp)",fontWeight:400,fontSize:22}}>All Runs</h3>
          <div className="csub" style={{color:"var(--txt-3)",fontSize:12}}>Newest first · best 1K split shown where lap data exists</div>
        </div>
        <div style={{overflowX:"auto"}}>
        <table>
          <thead><tr>
            <th>Date</th><th>Type</th><th>Distance</th><th>Time</th><th>Avg Pace</th>
            <th>Best 1K</th><th>HR</th><th>Elev</th>
          </tr></thead>
          <tbody>
            {D.runs.map(r=>(
              <tr key={r.labelId}>
                <td className="mono">{shortDate(r.date)} <span style={{color:"var(--txt-3)",fontSize:11}}>{r.date.slice(0,4)}</span></td>
                <td><span className={`chip ${r.category}`}>{r.sportName}</span></td>
                <td className="mono">{r.distKm} km</td>
                <td className="mono">{r.duration}</td>
                <td className="mono" style={{fontWeight:700}}>{r.pace||"—"}</td>
                <td className="mono" style={{color:"var(--run)"}}>{r.best1kPace||"—"}</td>
                <td className="mono" style={{color:"var(--txt-2)"}}>{r.hr||"—"}</td>
                <td className="mono" style={{color:"var(--txt-3)"}}>{r.elevGain?`${Math.round(r.elevGain)}m`:"—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  );
}

function Segments(){
  return (
    <div>
      <div className="sec-head">
        <h2>Segment Bests</h2>
        <div className="sub">Fastest individual 1K efforts across all flat runs</div>
      </div>
      <div className="card reveal" style={{padding:0,overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
        <table>
          <thead><tr>
            <th>#</th><th>1K Time</th><th>Pace</th><th>Run</th><th>Date</th><th>Lap</th><th>HR</th>
          </tr></thead>
          <tbody>
            {D.segments.map(s=>(
              <tr key={s.labelId+"-"+s.lapIndex}>
                <td className={`rank ${s.rank<=3?"r"+s.rank:""}`}>{s.rank}</td>
                <td className="mono" style={{fontWeight:700,color:s.rank===1?"var(--run)":"var(--txt)"}}>
                  {Math.floor(s.seconds/60)}:{String(Math.round(s.seconds%60)).padStart(2,"0")}
                </td>
                <td className="mono">{s.pace} /km</td>
                <td style={{color:"var(--txt-2)"}}>{s.runName}</td>
                <td className="mono" style={{color:"var(--txt-2)"}}>{shortDate(s.date)}</td>
                <td className="mono" style={{color:"var(--txt-3)"}}>#{s.lapIndex}</td>
                <td className="mono" style={{color:"var(--txt-3)"}}>{s.hr||"—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
        </div>
        {D.segments.length===0 && <div className="empty">No segment data yet.</div>}
      </div>
      <div className="sub" style={{color:"var(--txt-3)",fontSize:12,marginTop:12}}>
        Segments are 1K splits auto-detected by the watch. Trail runs are excluded (elevation skews pace).
      </div>
    </div>
  );
}

function Strength(){
  return (
    <div>
      <div className="sec-head">
        <h2>Strength</h2>
        <div className="sub">Latest session vs previous vs routine average · grouped by workout</div>
      </div>
      <div className="grid" style={{gap:18}}>
        {D.strengthGroups.map((g,i)=>{
          const l=g.latest,p=g.prev;
          const durDelta = p&&p.durationSec&&l.durationSec ? l.durationSec-p.durationSec : null;
          return (
            <div className="card routine reveal" key={g.routine} style={{transitionDelay:`${i*60}ms`}}>
              <div className="top">
                <div>
                  <h3>{g.routine}</h3>
                  <div className="cnt">{g.count} sessions · {shortDate(g.firstDate)} → {shortDate(g.latestDate)}</div>
                </div>
                <span className="chip strength">strength</span>
              </div>
              <div className="body">
                <div className="metric">
                  <div className="mk">Latest · Sets</div>
                  <div className="mv">{l.sets??"—"}<small> sets</small>
                    <Delta now={l.sets} prev={p?p.sets:null}/>
                  </div>
                  <div style={{fontSize:11,color:"var(--txt-3)",marginTop:4}}>avg {g.avg.sets}</div>
                </div>
                <div className="metric">
                  <div className="mk">Latest · Duration</div>
                  <div className="mv">{l.duration||"—"}
                    {durDelta!=null && <span className={`delta ${Math.abs(durDelta)<60?"flat":durDelta>0?"up":"down"}`}>
                      {durDelta>0?"▲":"▼"} {Math.abs(Math.round(durDelta/60))}m</span>}
                  </div>
                  <div style={{fontSize:11,color:"var(--txt-3)",marginTop:4}}>avg {Math.round((g.avg.durationSec||0)/60)}m</div>
                </div>
                <div className="metric">
                  <div className="mk">Latest · Calories</div>
                  <div className="mv">{l.cal??"—"}<small> kcal</small>
                    <Delta now={l.cal} prev={p?p.cal:null}/>
                  </div>
                  <div style={{fontSize:11,color:"var(--txt-3)",marginTop:4}}>avg {Math.round(g.avg.cal||0)}</div>
                </div>
                <div className="spark">
                  <div className="mk" style={{fontSize:10,letterSpacing:".16em",textTransform:"uppercase",color:"var(--txt-3)",fontWeight:600}}>Calories · trend</div>
                  <div style={{marginTop:8}}><Sparkline values={g.trend.map(x=>x.cal).filter(Boolean)}/></div>
                  <div style={{fontSize:11,color:"var(--txt-3)",marginTop:6}}>HR avg {Math.round(g.avg.hr||0)} bpm</div>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {D.strengthGroups.length===0 && <div className="card empty">No repeated strength routines yet.</div>}
    </div>
  );
}

/* ------------------------------ app ------------------------------ */
function App(){
  const [tab,setTab]=useState("overview");
  useReveal();
  if(!D) return <div className="empty" style={{padding:80}}>Loading data… (data.js missing)</div>;
  const tabs=[
    {id:"overview",label:"Overview",n:D.totals.activities},
    {id:"pbs",label:"Personal Bests",n:D.pbs.length},
    {id:"segments",label:"Segments",n:D.segments.length},
    {id:"strength",label:"Strength",n:D.strengthGroups.length},
  ];
  const a=D.assessment;
  return (
    <div>
      <header>
        <div className="wrap id-row">
          <div className="who">
            <div className="eyebrow"><span className="dot"></span>Training Log · COROS synced</div>
            <h1>LIPING <span className="accent">ZHANG</span></h1>
            <div className="meta">
              <span>📍 {D.athlete.location}</span>
              <span>Updated <b>{D.generated.replace("T"," ").slice(0,16)}</b></span>
            </div>
          </div>
          <div className="assess">
            <div className="cell"><div className="k">VO₂max</div><div className="v o">{a.vo2max}</div></div>
            <div className="cell"><div className="k">Threshold</div><div className="v b">{a.thresholdPace}<small>/km</small></div></div>
            <div className="cell"><div className="k">5K Pred</div><div className="v g">{a.pred5k}</div></div>
          </div>
        </div>
      </header>

      <nav className="tabs"><div className="wrap inner">
        {tabs.map(t=>(
          <button key={t.id} className={`tab ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>
            {t.label}<span className="n">{t.n}</span>
          </button>
        ))}
      </div></nav>

      <main><div className="wrap">
        <div className={`panel ${tab==="overview"?"active":""}`}><Overview/></div>
        <div className={`panel ${tab==="pbs"?"active":""}`}><PBs/></div>
        <div className={`panel ${tab==="segments"?"active":""}`}><Segments/></div>
        <div className={`panel ${tab==="strength"?"active":""}`}><Strength/></div>
      </div></main>

      <footer><div className="wrap">
        <span>Liping Zhang · personal training dashboard</span>
        <span>Data: COROS · auto-refreshed on new activity</span>
      </div></footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
  // Transform the app with the CLASSIC JSX runtime (React.createElement) so it
  // works with the UMD React build. The automatic runtime would emit
  // `import ... from "react/jsx-runtime"`, which fails in a classic script.
  (function () {
    var src = document.getElementById("app-code").textContent;
    try {
      var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] });
      new Function("React", "ReactDOM", out.code)(React, ReactDOM);
    } catch (e) {
      var root = document.getElementById("root");
      if (root) root.innerHTML =
        '<div style="color:#ff5d5d;font-family:monospace;padding:40px">Failed to start dashboard: ' +
        (e && e.message ? e.message : e) + '</div>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
