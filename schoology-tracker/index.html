<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Schoology Tracker — Glenn &amp; Sheldon</title>
<style>
  :root {
    --bg: #0b1120;
    --surface: #131b2e;
    --surface-2: #1c2640;
    --border: #2a3656;
    --text: #e6ecff;
    --muted: #94a3b8;
    --dim: #64748b;
    --glenn: #3b82f6;
    --glenn-deep: #1d4ed8;
    --sheldon: #a855f7;
    --sheldon-deep: #7c3aed;
    --good: #10b981;
    --ok: #fbbf24;
    --warn: #f97316;
    --bad: #ef4444;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text", Inter, Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }

  .page-header {
    background: linear-gradient(135deg, #1e293b 0%, #0b1120 100%);
    padding: 22px 28px 26px;
    border-bottom: 1px solid var(--border);
  }
  .page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .page-header .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .page-header .meta { color: var(--dim); font-size: 12px; margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  .page-header .meta b { color: var(--text); font-weight: 600; }

  .container { max-width: 1320px; margin: 0 auto; padding: 22px; }

  .overdue-banner {
    background: linear-gradient(90deg, rgba(239,68,68,0.18), rgba(239,68,68,0.06));
    border: 1px solid rgba(239,68,68,0.4);
    border-left: 4px solid var(--bad);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 18px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .overdue-banner .icon { font-size: 22px; line-height: 1; }
  .overdue-banner h3 { font-size: 14px; margin-bottom: 6px; color: #fecaca; }
  .overdue-banner .list { color: #fca5a5; font-size: 13px; }
  .overdue-banner .item { padding: 2px 0; }
  .overdue-banner .item .days { color: #ef4444; font-weight: 600; }

  .tabs {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 18px;
    gap: 2px;
  }
  .tab {
    padding: 8px 16px;
    border-radius: 7px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface-2); color: var(--text); }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .sort-control {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted); font-size: 12px;
  }
  .sort-control select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .student-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
  }
  @media (max-width: 960px) {
    .student-grid { grid-template-columns: 1fr; }
    .container { padding: 16px; }
    .page-header { padding: 18px 18px 20px; }
  }

  .student-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .student-header {
    padding: 18px 20px;
    background: linear-gradient(135deg, var(--glenn) 0%, var(--glenn-deep) 100%);
    color: #fff;
  }
  .student-card.sheldon .student-header {
    background: linear-gradient(135deg, var(--sheldon) 0%, var(--sheldon-deep) 100%);
  }
  .student-header h2 { font-size: 19px; font-weight: 700; }
  .student-header .sub { font-size: 12px; opacity: 0.85; margin-top: 3px; }

  .student-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 14px 12px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat .v { font-size: 20px; font-weight: 700; color: var(--text); }
  .stat .v.good { color: var(--good); }
  .stat .v.ok { color: var(--ok); }
  .stat .v.warn { color: var(--warn); }
  .stat .v.bad { color: var(--bad); }
  .stat .l {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 4px;
  }

  .course-list { padding: 6px 0; }
  .course {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(42,54,86,0.55);
    transition: background .15s;
    cursor: pointer;
    user-select: none;
  }
  .course:last-child { border-bottom: none; }
  .course:hover { background: rgba(28,38,64,0.5); }
  .course-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
  }
  .course-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .course-name .chev { color: var(--dim); font-size: 11px; margin-left: 6px; transition: transform .15s; display: inline-block; }
  .course.open .chev { transform: rotate(90deg); }
  .sparkline { width: 60px; height: 18px; opacity: 0.85; }
  .grade-pill {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    min-width: 78px;
    justify-content: center;
    border: 1px solid transparent;
  }
  .grade-pill .letter { font-size: 13px; font-weight: 700; }
  .grade-pill .pct { font-size: 11px; opacity: 0.85; }
  .g-good { background: rgba(16,185,129,0.15); color: var(--good); border-color: rgba(16,185,129,0.3); }
  .g-ok   { background: rgba(251,191,36,0.15); color: var(--ok);  border-color: rgba(251,191,36,0.3); }
  .g-warn { background: rgba(249,115,22,0.18); color: var(--warn); border-color: rgba(249,115,22,0.3); }
  .g-bad  { background: rgba(239,68,68,0.18); color: var(--bad);  border-color: rgba(239,68,68,0.35); }
  .g-none { background: rgba(100,116,139,0.15); color: var(--muted); border-color: rgba(100,116,139,0.25); }

  .progress {
    margin-top: 10px;
    height: 6px;
    width: 100%;
    background: rgba(255,255,255,0.05);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress > span { display: block; height: 100%; border-radius: 999px; transition: width .4s ease; }

  .course-detail {
    margin-top: 12px;
    padding: 12px 14px;
    background: rgba(11,17,32,0.7);
    border-radius: 8px;
    border: 1px solid var(--border);
    display: none;
  }
  .course.open .course-detail { display: block; }
  .course-detail .full {
    font-size: 11px; color: var(--dim); margin-bottom: 8px;
  }
  .assign {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(42,54,86,0.5);
    font-size: 13px;
  }
  .assign:last-child { border-bottom: none; }
  .assign .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .assign .score { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .assign .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    min-width: 50px; text-align: center;
  }
  .none {
    padding: 14px;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    font-style: italic;
  }

  .empty-state {
    padding: 50px 22px;
    text-align: center;
    color: var(--dim);
  }
  .empty-state .icon { font-size: 42px; margin-bottom: 12px; opacity: 0.5; }

  .timeline {
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .timeline h3 {
    padding: 14px 20px;
    font-size: 15px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .timeline h3 .count { color: var(--dim); font-size: 12px; font-weight: 400; }
  .timeline-item {
    display: grid;
    grid-template-columns: 14px 1fr auto;
    gap: 10px;
    padding: 11px 20px;
    border-bottom: 1px solid rgba(42,54,86,0.5);
    font-size: 13px;
    align-items: center;
  }
  .timeline-item:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin: 0 auto; }
  .dot.grade_posted { background: var(--good); }
  .dot.assignment_due { background: var(--glenn); }
  .dot.overdue { background: var(--bad); }
  .timeline-item .who { color: var(--text); font-weight: 600; }
  .timeline-item .course { color: var(--muted); padding: 0; border: none; }
  .timeline-item .subject { color: var(--muted); }
  .timeline-item .when { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }

  .loading, .error {
    text-align: center;
    padding: 60px 22px;
    color: var(--dim);
  }
  .error { color: var(--bad); }

  .footer {
    text-align: center;
    padding: 22px;
    color: var(--dim);
    font-size: 11px;
  }
</style>
</head>
<body>
<div id="app" class="loading">Loading Schoology data…</div>

<script>
  "use strict";

  const STUDENTS = ["Glenn", "Sheldon"];
  const STORAGE_KEY = "schoology-prefs-v1";

  const prefs = (() => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  })();
  function savePref(k, v) { prefs[k] = v; localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs)); }

  function gradeBand(pct) {
    if (pct == null || isNaN(pct)) return "none";
    if (pct >= 90) return "good";
    if (pct >= 80) return "ok";
    if (pct >= 70) return "warn";
    return "bad";
  }
  function parsePct(s) {
    if (typeof s === "number") return s;
    if (!s) return null;
    const n = parseFloat(String(s).replace("%", ""));
    return isFinite(n) ? n : null;
  }
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        if (k === "class") e.className = attrs[k];
        else if (k === "html") e.innerHTML = attrs[k];
        else if (k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
        else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
      }
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      e.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return e;
  }

  function sparkline(values, color) {
    if (!values || values.length < 2) return null;
    const w = 60, h = 18, pad = 1;
    const min = Math.min(...values), max = Math.max(...values);
    const range = Math.max(max - min, 1);
    const pts = values.map((v, i) => {
      const x = pad + (i * (w - pad * 2)) / (values.length - 1);
      const y = h - pad - ((v - min) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "sparkline");
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    line.setAttribute("points", pts);
    line.setAttribute("fill", "none");
    line.setAttribute("stroke", color);
    line.setAttribute("stroke-width", "1.5");
    line.setAttribute("stroke-linecap", "round");
    line.setAttribute("stroke-linejoin", "round");
    svg.appendChild(line);
    return svg;
  }

  function renderApp(data, history) {
    document.getElementById("app").remove();
    const root = el("div", { id: "app" });
    document.body.appendChild(root);
    render(root, data, history);
  }

  function summarize(student, data) {
    const courses = data?.students?.[student]?.courses || {};
    const list = Object.values(courses);
    const pcts = list.map(c => parsePct(c.percentage)).filter(v => v != null);
    const avg = pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : null;
    const counts = { good: 0, ok: 0, warn: 0, bad: 0, none: 0 };
    pcts.forEach(p => counts[gradeBand(p)]++);
    const overdue = (data?.students?.[student]?.overdue || []).length;
    return { avg, counts, overdue, totalCourses: list.length };
  }

  function trendValues(history, student, course) {
    if (!history?.snapshots) return [];
    return history.snapshots
      .map(s => s.grades?.[student]?.[course])
      .filter(v => typeof v === "number");
  }

  function sortCourses(entries, sortBy) {
    const arr = [...entries];
    if (sortBy === "attention") {
      arr.sort((a, b) => (parsePct(a[1].percentage) ?? 200) - (parsePct(b[1].percentage) ?? 200));
    } else if (sortBy === "grade") {
      arr.sort((a, b) => (parsePct(b[1].percentage) ?? -1) - (parsePct(a[1].percentage) ?? -1));
    } else {
      arr.sort((a, b) => a[0].localeCompare(b[0]));
    }
    return arr;
  }

  function studentCard(student, data, history, sortBy, color) {
    const courses = data?.students?.[student]?.courses || {};
    const entries = sortCourses(Object.entries(courses), sortBy);
    const { avg, counts, overdue } = summarize(student, data);

    const stats = el("div", { class: "student-stats" },
      el("div", { class: "stat" },
        el("div", { class: "v " + gradeBand(avg) }, avg != null ? avg.toFixed(1) + "%" : "—"),
        el("div", { class: "l" }, "Average"),
      ),
      el("div", { class: "stat" },
        el("div", { class: "v" }, String(entries.length)),
        el("div", { class: "l" }, "Courses"),
      ),
      el("div", { class: "stat" },
        el("div", { class: "v good" }, String(counts.good)),
        el("div", { class: "l" }, "≥90%"),
      ),
      el("div", { class: "stat" },
        el("div", { class: "v " + (overdue > 0 ? "bad" : "") }, String(overdue)),
        el("div", { class: "l" }, "Overdue"),
      ),
    );

    let body;
    if (entries.length === 0) {
      body = el("div", { class: "empty-state" },
        el("div", { class: "icon" }, "📭"),
        el("div", null, "No courses yet"),
        el("div", { style: "font-size:11px; margin-top:6px;" }, "Waiting for the next Schoology Weekly Summary…"),
      );
    } else {
      body = el("div", { class: "course-list" }, entries.map(([name, c]) => courseRow(student, name, c, history, color)));
    }

    return el("div", { class: "student-card " + (student === "Sheldon" ? "sheldon" : "") },
      el("div", { class: "student-header" },
        el("h2", null, student),
        el("div", { class: "sub" }, `Grade ${data?.students?.[student]?.grade ?? 10} · ${data?.students?.[student]?.school || "Lynbrook High School"}`),
      ),
      stats,
      body,
    );
  }

  function courseRow(student, name, c, history, color) {
    const pct = parsePct(c.percentage);
    const band = gradeBand(pct);
    const trend = trendValues(history, student, name);

    const grade = el("div", { class: "grade-pill g-" + band },
      el("span", { class: "letter" }, c.grade && c.grade !== "-" ? c.grade : "—"),
      el("span", { class: "pct" }, c.percentage || ""),
    );

    const row = el("div", { class: "course-row" },
      el("div", { class: "course-name" }, name, el("span", { class: "chev" }, "▸")),
      sparkline(trend, color) || el("span", { style: "width:60px; display:inline-block;" }),
      grade,
    );

    const bar = el("div", { class: "progress" }, el("span", {
      style: `width:${Math.min(Math.max(pct ?? 0, 0), 100)}%; background:var(--${band === "good" ? "good" : band === "ok" ? "ok" : band === "warn" ? "warn" : band === "bad" ? "bad" : "dim"});`,
    }));

    const assignments = (c.assignments || []).slice().reverse();
    const detail = el("div", { class: "course-detail" },
      c.full_name && el("div", { class: "full" }, c.full_name),
      assignments.length === 0
        ? el("div", { class: "none" }, "No assignments listed yet")
        : assignments.map(a => assignmentRow(a)),
    );

    const wrap = el("div", { class: "course" }, row, bar, detail);
    wrap.addEventListener("click", () => wrap.classList.toggle("open"));
    return wrap;
  }

  function assignmentRow(a) {
    const band = gradeBand(a.percentage);
    return el("div", { class: "assign" },
      el("div", { class: "name" }, a.name),
      el("div", { class: "score" }, a.score),
      el("div", { class: "badge g-" + band }, (a.percentage != null) ? a.percentage + "%" : ""),
    );
  }

  function overdueBanner(data) {
    const items = [];
    for (const s of STUDENTS) {
      for (const o of (data?.students?.[s]?.overdue || [])) {
        items.push({ student: s, ...o });
      }
    }
    if (items.length === 0) return null;
    items.sort((a, b) => b.days_overdue - a.days_overdue);
    return el("div", { class: "overdue-banner" },
      el("div", { class: "icon" }, "⚠️"),
      el("div", { style: "flex:1; min-width:0;" },
        el("h3", null, `${items.length} overdue assignment${items.length > 1 ? "s" : ""}`),
        el("div", { class: "list" },
          items.slice(0, 6).map(i => el("div", { class: "item" },
            el("b", null, i.student), " · ", i.assignment, " ",
            el("span", { class: "days" }, `${i.days_overdue}d overdue`),
            " · due ", i.due_date,
          )),
          items.length > 6 ? el("div", { class: "item", style: "color:var(--dim);" }, `+${items.length - 6} more`) : null,
        ),
      ),
    );
  }

  function eventTimeline(data) {
    const events = (data?.events || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 25);
    if (events.length === 0) return null;
    return el("div", { class: "timeline" },
      el("h3", null,
        el("span", null, "📋 Recent Activity"),
        el("span", { class: "count" }, `${events.length} events`),
      ),
      events.map(e => el("div", { class: "timeline-item" },
        el("span", null, el("span", { class: "dot " + (e.type || "general") })),
        el("div", null,
          el("span", { class: "who" }, e.student || ""), " · ",
          el("span", { class: "course" }, e.course || ""), " — ",
          el("span", { class: "subject" }, e.subject || ""),
          e.grade ? el("span", { style: "color: var(--good); margin-left:6px;" }, `[${e.grade}]`) : null,
        ),
        el("span", { class: "when" }, fmtDate(e.date)),
      )),
    );
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function totalsLine(data) {
    let total = 0, overdue = 0;
    for (const s of STUDENTS) {
      const sd = data?.students?.[s];
      if (!sd) continue;
      total += Object.values(sd.courses || {}).length;
      overdue += (sd.overdue || []).length;
    }
    return { total, overdue };
  }

  function render(root, data, history) {
    root.className = "";
    const tab = prefs.tab && ["both", "Glenn", "Sheldon"].includes(prefs.tab) ? prefs.tab : "both";
    const sortBy = prefs.sortBy && ["attention", "name", "grade"].includes(prefs.sortBy) ? prefs.sortBy : "attention";
    const totals = totalsLine(data);
    const updatedRaw = data?.last_updated ? new Date(data.last_updated) : null;
    const updatedStr = updatedRaw && !isNaN(updatedRaw)
      ? updatedRaw.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })
      : "—";

    const header = el("div", { class: "page-header" },
      el("h1", null, "📚 Schoology Tracker"),
      el("div", { class: "sub" }, "Glenn & Sheldon · Lynbrook High School"),
      el("div", { class: "meta" },
        el("span", null, "Updated ", el("b", null, updatedStr)),
        el("span", null, el("b", null, String(data?.email_count ?? 0)), " emails processed"),
        el("span", null, el("b", null, String(totals.total)), " courses tracked"),
        totals.overdue > 0
          ? el("span", { style: "color:var(--bad);" }, "⚠ ", el("b", null, String(totals.overdue)), " overdue")
          : null,
      ),
    );

    const tabs = el("div", { class: "tabs" },
      ["both", "Glenn", "Sheldon"].map(t => el("button", {
        class: "tab" + (tab === t ? " active" : ""),
        onclick: () => { savePref("tab", t); renderApp(data, history); },
      }, t === "both" ? "Both" : t)),
    );

    const sortSelect = el("select", {
      onchange: e => { savePref("sortBy", e.target.value); renderApp(data, history); },
    },
      el("option", { value: "attention" }, "Needs attention"),
      el("option", { value: "grade" }, "Highest grade"),
      el("option", { value: "name" }, "Name"),
    );
    sortSelect.value = sortBy;

    const toolbar = el("div", { class: "toolbar" },
      tabs,
      el("div", { class: "sort-control" }, "Sort:", sortSelect),
    );

    const showGlenn = tab === "both" || tab === "Glenn";
    const showSheldon = tab === "both" || tab === "Sheldon";
    const cards = [];
    if (showGlenn) cards.push(studentCard("Glenn", data, history, sortBy, "#60a5fa"));
    if (showSheldon) cards.push(studentCard("Sheldon", data, history, sortBy, "#c084fc"));

    const grid = el("div", { class: "student-grid", style: cards.length === 1 ? "grid-template-columns: 1fr; max-width: 680px; margin: 0 auto;" : "" }, cards);

    const container = el("div", { class: "container" },
      overdueBanner(data),
      toolbar,
      grid,
      eventTimeline(data),
    );

    root.appendChild(header);
    root.appendChild(container);
    root.appendChild(el("div", { class: "footer" },
      "Auto-updated from Schoology email notifications · Powered by Hermes Agent",
    ));
  }

  function bust(url) { return url + "?t=" + Date.now(); }

  Promise.all([
    fetch(bust("data.json")).then(r => r.ok ? r.json() : null),
    fetch(bust("history.json")).then(r => r.ok ? r.json() : { snapshots: [] }).catch(() => ({ snapshots: [] })),
  ]).then(([data, history]) => {
    if (!data) {
      document.getElementById("app").outerHTML =
        '<div id="app" class="error">⚠️ data.json not found.<br><small>The pipeline will create it on next run.</small></div>';
      return;
    }
    renderApp(data, history);
  }).catch(err => {
    document.getElementById("app").outerHTML =
      `<div id="app" class="error">⚠️ ${String(err.message || err)}</div>`;
  });
</script>
</body>
</html>
